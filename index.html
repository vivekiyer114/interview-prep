<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prep Desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#fundamentals"><span class="brand-name"><b>Prep</b> Desk</span><span class="brand-sub">Khyaal edition</span></a>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav id="categories" aria-label="Categories"></nav>
    </aside>

    <main>
      <section class="hero">
        <div class="hero-text">
          <p class="kicker mono" id="kicker"></p>
          <h1 id="title"></h1>
          <p class="intro" id="intro"></p>
        </div>
        <div class="progress">
          <h2>Your progress</h2>
          <div class="bar" role="progressbar" aria-label="Concepts done" aria-valuemin="0" id="bar"><div class="bar-fill" id="bar-fill"></div></div>
          <p class="progress-text mono" id="progress-text"></p>
          <ol>
            <li>Pick a concept and study it in depth.</li>
            <li>Explain it out loud, and where you used it.</li>
            <li>Mark it done to track your revision.</li>
          </ol>
          <button type="button" class="link-button" id="reset">Reset progress</button>
        </div>
      </section>

      <div class="controls">
        <input id="search" type="search" placeholder="Search a concept or problem… (e.g. idempotency, RAG, Dijkstra, 1254)" aria-label="Search concepts" autocomplete="off">
        <div class="filters" role="group" aria-label="Show">
          <button type="button" data-filter="all">All</button>
          <button type="button" data-filter="todo">To do</button>
          <button type="button" data-filter="done">Done</button>
        </div>
      </div>

      <div id="sections"></div>
      <p class="empty" id="empty" hidden>No concepts match that search.</p>
    </main>
  </div>

  <script src="concepts.js" charset="utf-8"></script>
  <script src="dsa.js" charset="utf-8"></script>
  <script src="app.js" charset="utf-8"></script>
</body>
</html>
